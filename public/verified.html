<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verified - USKAN</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #EBF4FF, #D6EAF8, #AED6F1);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .verification-page {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 50, 100, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .verification-page::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(49, 130, 206, 0.06), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .icon {
            font-size: 36px;
            display: block;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1A2A3A;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }
        
        .message {
            font-size: 16px;
            color: #4A5568;
            line-height: 1.7;
            position: relative;
            z-index: 1;
        }
        
        .message strong {
            color: #1A2A3A;
        }
        
        .footer-text {
            font-size: 13px;
            color: #A0AEC0;
            margin-top: 24px;
            position: relative;
            z-index: 1;
        }
        
        @media (max-width: 480px) {
            .verification-page {
                padding: 32px 20px;
            }
            h1 {
                font-size: 24px;
            }
            .icon {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="verification-page">
        <span class="icon">✅</span>
        <h1>Email Verified!</h1>
        <p class="message">
            You can now go back to your session and login.<br />
            Use your email and the password you created.
        </p>
        <p class="footer-text">© 2025 USKAN</p>
    </div>

    <script>
        (async function() {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const queryParams = new URLSearchParams(window.location.search);
            const accessToken = hashParams.get('access_token');
            const refreshToken = hashParams.get('refresh_token');
            const returnTo = queryParams.get('returnTo') || 'index.html';

            const messageEl = document.querySelector('.message');
            const titleEl = document.querySelector('h1');

            if (!accessToken) {
                if (messageEl) {
                    messageEl.innerHTML = 'You can now log in to continue.<br /><a href="login.html?returnTo=' + encodeURIComponent(returnTo) + '" style="color:#3182CE; font-weight:600;">Click here to log in</a>';
                }
                return;
            }

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'complete-verification', accessToken, refreshToken })
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    if (titleEl) titleEl.textContent = "You're All Set!";
                    if (messageEl) messageEl.textContent = 'Redirecting you back...';
                    setTimeout(() => {
                        window.location.href = returnTo;
                    }, 1200);
                } else {
                    if (messageEl) {
                        messageEl.innerHTML = 'Your email is verified. Please <a href="login.html?returnTo=' + encodeURIComponent(returnTo) + '" style="color:#3182CE; font-weight:600;">log in</a> to continue.';
                    }
                }
            } catch (error) {
                console.error('Verification completion error:', error);
                if (messageEl) {
                    messageEl.innerHTML = 'Your email is verified. Please <a href="login.html?returnTo=' + encodeURIComponent(returnTo) + '" style="color:#3182CE; font-weight:600;">log in</a> to continue.';
                }
            }
        })();
    </script>
</body>
</html>
