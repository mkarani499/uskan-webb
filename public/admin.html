<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - USKAN</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        .admin-login-container { max-width: 420px; margin: 60px auto; text-align: center; }
        .admin-login-box { background: var(--white); padding: 40px; border-radius: 16px; box-shadow: var(--shadow-lg); border: 1px solid #E2E8F0; }
        .admin-login-box .lock-icon { font-size: 48px; display: block; margin-bottom: 8px; }
        .admin-login-box h1 { font-size: 28px; color: var(--navy); margin-bottom: 4px; }
        .admin-login-box .subtitle { color: var(--medium-grey); font-size: 14px; margin-bottom: 24px; }
        .admin-login-box .form-group { margin-bottom: 16px; text-align: left; }
        .admin-login-box .form-group label { display: block; font-weight: 600; font-size: 14px; color: var(--dark-grey); margin-bottom: 4px; }
        .admin-login-box .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #E2E8F0; border-radius: 10px; font-size: 16px; outline: none; transition: border-color 0.2s; }
        .admin-login-box .form-group input:focus { border-color: var(--logic-blue); }
        .admin-login-box .btn-admin-login { width: 100%; padding: 14px; font-size: 18px; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--navy), #2C3E50); color: white; font-weight: 700; cursor: pointer; transition: all 0.3s ease; margin-top: 8px; }
        .admin-login-box .btn-admin-login:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(26, 42, 58, 0.3); }
        .admin-login-box .login-error { color: #E53E3E; font-size: 14px; margin-top: 12px; display: none; padding: 10px; background: #FFF5F5; border-radius: 8px; border-left: 4px solid #E53E3E; }
        .admin-login-box .login-error.show { display: block; }
        footer { margin-top: 24px; text-align: center; font-size: 14px; color: var(--medium-grey); }
    </style>
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-login-box">
            <span class="lock-icon">🔒</span>
            <h1>Admin Access</h1>
            <p class="subtitle">Enter your password to access the dashboard</p>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminPassword">🔑 Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter admin password" required autofocus />
                </div>
                <button type="submit" class="btn-admin-login">🚀 Login to Dashboard</button>
                <div id="loginError" class="login-error">❌ Incorrect password. Please try again.</div>
            </form>
        </div>
        <footer><p>© 2025 USKAN. All rights reserved.</p></footer>
    </div>
    <script src="script.js"></script>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const password = document.getElementById('adminPassword').value;
            const errorDiv = document.getElementById('loginError');
            
            errorDiv.classList.remove('show');
            
            try {
                const response = await fetch('/api/admin-verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('adminSession', 'true');
                    window.location.href = 'admin-dashboard.html';
                } else {
                    errorDiv.textContent = '❌ ' + (data.error || 'Incorrect password');
                    errorDiv.classList.add('show');
                    document.getElementById('adminPassword').value = '';
                    document.getElementById('adminPassword').focus();
                }
            } catch (error) {
                errorDiv.textContent = '❌ Network error. Please try again.';
                errorDiv.classList.add('show');
            }
        });
    </script>
</body>
</html>
