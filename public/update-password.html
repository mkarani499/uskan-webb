<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update Password - USKAN</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 420px;
            max-width: 95%;
        }
        .auth-box h1 {
            color: #1a1a2e;
            font-size: 28px;
            margin-bottom: 4px;
        }
        .auth-box .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .auth-box .form-group {
            margin-bottom: 16px;
        }
        .auth-box .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #333;
            margin-bottom: 4px;
        }
        .auth-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        .auth-box .form-group input:focus {
            border-color: #4a90d9;
        }
        .auth-box .form-group small {
            font-size: 12px;
            color: #888;
            display: block;
            margin-top: 4px;
        }
        .auth-box .auth-btn {
            width: 100%;
            padding: 14px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .auth-box .auth-btn:hover {
            background: #1e8449;
        }
        .auth-box .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .auth-box .auth-error {
            color: #e74c3c;
            font-size: 14px;
            padding: 10px 14px;
            background: #fde8e8;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
            margin-bottom: 16px;
            display: none;
        }
        .auth-box .auth-success {
            color: #27ae60;
            font-size: 14px;
            padding: 10px 14px;
            background: #e8f8ed;
            border-radius: 8px;
            border-left: 4px solid #27ae60;
            margin-bottom: 16px;
            display: none;
        }
        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="auth-box">
        <h1>🔑 Update Password</h1>
        <p class="subtitle">Enter your new password below.</p>

        <div id="authError" class="auth-error"></div>
        <div id="authSuccess" class="auth-success"></div>

        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password" required />
            <small>Password must be at least 6 characters</small>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm new password" required />
        </div>

        <button onclick="handleUpdatePassword()" class="auth-btn" id="updateBtn">Update Password</button>

        <a href="login.html" class="back-link">← Back to Login</a>
    </div>

    <script>
        // ============================================================
        // UPDATE PASSWORD - Uses API (No Supabase client needed)
        // ============================================================

        async function handleUpdatePassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('authError');
            const successDiv = document.getElementById('authSuccess');
            const btn = document.getElementById('updateBtn');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (!newPassword || !confirmPassword) {
                errorDiv.textContent = 'Please fill in both fields.';
                errorDiv.style.display = 'block';
                return;
            }

            if (newPassword.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters.';
                errorDiv.style.display = 'block';
                return;
            }

            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match.';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Updating...';

            try {
                // Get the access token from URL (Supabase adds it as a fragment)
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const accessToken = hashParams.get('access_token');

                if (!accessToken) {
                    errorDiv.textContent = '❌ Invalid reset link. Please request a new one.';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Update Password';
                    return;
                }

                // ✅ Call the backend API
                const response = await fetch('/api/update-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        password: newPassword,
                        accessToken: accessToken
                    })
                });

                const data = await response.json();

                if (data.success) {
                    successDiv.textContent = '✅ ' + data.message + ' Redirecting to login...';
                    successDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Update Password';

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    errorDiv.textContent = '❌ ' + (data.error || 'Failed to update password');
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Update Password';
                }

            } catch (error) {
                console.error('Update password error:', error);
                errorDiv.textContent = '❌ Network error. Please try again.';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        }
    </script>
</body>
</html>
