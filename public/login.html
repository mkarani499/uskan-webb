<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - USKAN</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: Arial, sans-serif; }
        .auth-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 420px; max-width: 95%; }
        .auth-box h1 { color: #1a1a2e; font-size: 28px; margin-bottom: 4px; }
        .auth-box .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
        .auth-box .form-group { margin-bottom: 16px; }
        .auth-box .form-group label { display: block; font-weight: 600; font-size: 14px; color: #333; margin-bottom: 4px; }
        .auth-box .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; }
        .auth-box .form-group input:focus { border-color: #4a90d9; }
        .auth-box .auth-btn { width: 100%; padding: 14px; background: #4a90d9; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
        .auth-box .auth-btn:hover { background: #357abd; }
        .auth-box .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .auth-box .auth-switch { text-align: center; font-size: 14px; color: #666; margin-top: 16px; }
        .auth-box .auth-switch a { color: #4a90d9; text-decoration: none; font-weight: 600; }
        .auth-box .auth-switch a:hover { text-decoration: underline; }
        .auth-box .auth-error { color: #e74c3c; font-size: 14px; padding: 10px 14px; background: #fde8e8; border-radius: 8px; border-left: 4px solid #e74c3c; margin-bottom: 16px; display: none; }
        .auth-box .auth-success { color: #27ae60; font-size: 14px; padding: 10px 14px; background: #e8f8ed; border-radius: 8px; border-left: 4px solid #27ae60; margin-bottom: 16px; display: none; }
        .back-link { display: inline-block; margin-top: 16px; color: #888; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #333; }
        .forgot-link { text-align: right; font-size: 13px; margin-top: 4px; }
        .forgot-link a { color: #4a90d9; text-decoration: none; cursor: pointer; }
        .forgot-link a:hover { text-decoration: underline; }
        #forgotPasswordForm h2 { font-size: 20px; color: #1A2A3A; margin-bottom: 4px; }
        #forgotPasswordForm p.sub { color: #666; font-size: 14px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="auth-box">
        <h1>🔐 Login</h1>
        <p class="subtitle">Welcome back!</p>

        <div id="authError" class="auth-error"></div>
        <div id="authSuccess" class="auth-success"></div>

        <!-- Login Form -->
        <div id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" required />
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required />
            </div>

            <div class="forgot-link">
                <a href="javascript:void(0)" onclick="showForgotPassword()">Forgot password?</a>
            </div>

            <button onclick="handleLogin()" class="auth-btn" id="loginBtn">Login</button>

            <p class="auth-switch">
                Don't have an account? <a href="register.html">Register</a>
            </p>
        </div>

        <!-- Forgot Password Form (hidden by default) -->
        <div id="forgotPasswordForm" style="display:none;">
            <h2>🔑 Reset Password</h2>
            <p class="sub">Enter your email and we'll send you a reset link.</p>
            <div class="form-group">
                <label for="resetEmail">Email</label>
                <input type="email" id="resetEmail" placeholder="you@example.com" required />
            </div>
            <button onclick="handleResetPassword()" class="auth-btn" id="resetBtn" style="background:#4a90d9;">
                Send Reset Link
            </button>
            <p class="auth-switch" style="margin-top:12px;">
                <a href="javascript:void(0)" onclick="hideForgotPassword()" style="color:#888; text-decoration:none; font-size:14px;">
                    ← Back to Login
                </a>
            </p>
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        // Check for intent in URL
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const intent = urlParams.get('intent');
            if (intent === 'affiliate') {
                localStorage.setItem('intendedAction', 'affiliate');
                console.log('📌 Affiliate intent detected, will redirect back to results after login');
            }
        });

        // ============================================================
        // LOGIN HANDLER
        // ============================================================

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('authError');
            const successDiv = document.getElementById('authSuccess');
            const btn = document.getElementById('loginBtn');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (!email || !password) {
                errorDiv.textContent = 'Please enter both email and password.';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Logging in...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Save user to localStorage
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('accessToken', data.accessToken);

                    // ===== CHECK FOR INTENDED ACTION =====
                    const intendedAction = localStorage.getItem('intendedAction');
                    
                    if (intendedAction === 'affiliate') {
                        localStorage.removeItem('intendedAction');
                        successDiv.textContent = '✅ Login successful! Redirecting...';
                        successDiv.style.display = 'block';
                        setTimeout(() => {
                            window.location.href = 'results-full.html';
                        }, 1000);
                        return;
                    }

                    successDiv.textContent = '✅ Login successful! Redirecting...';
                    successDiv.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    errorDiv.textContent = '❌ ' + (data.error || 'Login failed');
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Login';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = '❌ Network error. Please try again.';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        }

        // Enter key support for login
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loginPassword').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleLogin();
            });
            // Enter key support for reset password
            document.getElementById('resetEmail').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleResetPassword();
            });
        });

        // ============================================================
        // FORGOT PASSWORD FUNCTIONS
        // ============================================================

        function showForgotPassword() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('forgotPasswordForm').style.display = 'block';
            document.getElementById('authError').style.display = 'none';
            document.getElementById('authSuccess').style.display = 'none';
            // Clear any previous input
            document.getElementById('resetEmail').value = '';
        }

        function hideForgotPassword() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('forgotPasswordForm').style.display = 'none';
            document.getElementById('authError').style.display = 'none';
            document.getElementById('authSuccess').style.display = 'none';
        }

        async function handleResetPassword() {
            const email = document.getElementById('resetEmail').value.trim();
            const errorDiv = document.getElementById('authError');
            const successDiv = document.getElementById('authSuccess');
            const btn = document.getElementById('resetBtn');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (!email) {
                errorDiv.textContent = 'Please enter your email address.';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Sending...';

            try {
                // ✅ Use Supabase Auth to send reset email
                const { data, error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: `${window.location.origin}/update-password.html`
                });

                if (error) {
                    errorDiv.textContent = '❌ ' + error.message;
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Send Reset Link';
                    return;
                }

                successDiv.textContent = '✅ Password reset email sent! Please check your inbox.';
                successDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';

                // Show login form after 3 seconds
                setTimeout(() => {
                    hideForgotPassword();
                }, 3000);

            } catch (error) {
                console.error('Reset password error:', error);
                errorDiv.textContent = '❌ Something went wrong. Please try again.';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
            }
        }
    </script>
</body>
</html>
